<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PoolRent">
  <defs>
    <linearGradient id="pool" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#2f5d8c"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7fd4c1"/>
      <stop offset="1" stop-color="#d6f2a8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#pool)"/>

  <!-- the pool: a full-range band -->
  <rect x="96" y="300" width="320" height="96" rx="48" fill="#0f1b30" opacity="0.75"/>
  <rect x="96" y="300" width="320" height="96" rx="48" fill="none" stroke="#7fd4c1" stroke-opacity="0.35" stroke-width="4"/>

  <!-- rent falling back into it -->
  <g fill="url(#flow)">
    <rect x="150" y="176" width="20" height="86" rx="10"/>
    <rect x="212" y="140" width="20" height="122" rx="10"/>
    <rect x="274" y="164" width="20" height="98" rx="10"/>
    <rect x="336" y="122" width="20" height="140" rx="10"/>
  </g>

  <!-- the bid that pays for the seat -->
  <path d="M256 96 L292 148 L220 148 Z" fill="#d6f2a8"/>
  <circle cx="256" cy="348" r="22" fill="#d6f2a8"/>
</svg>
