[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = [{ access = "read", path = "./out" }]
# Import mappings live in remappings.txt at the repository root.
# The Programmable review-target scanner requires the canonical mapping set there and
# rejects a foundry.toml that declares `remappings`. Do not move them back inline.

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
