name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: default

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv --no-match-path 'test/Fork.t.sol'

      # The fork suite is compatibility evidence against real deployed code. A broken assertion must
      # fail the build; a free endpoint that rate limits or drops archive state must not. A single
      # probe request cannot tell those apart — some endpoints answer one call and then return 429
      # under the request volume a fork run generates — so the suite itself is the probe. Each
      # candidate is tried in turn, and only a transport failure moves on to the next one.
      - name: Fork compatibility
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          set -uo pipefail
          transport='could not instantiate forked environment|database error|HTTP error|Max retries exceeded'
          for url in "${MAINNET_RPC_URL:-}" https://gateway.tenderly.co/public/mainnet \
                     https://eth-mainnet.public.blastapi.io https://eth.drpc.org; do
            [ -z "$url" ] && continue
            echo "--- fork suite against $url"
            if MAINNET_RPC_URL="$url" forge test -vv --match-path 'test/Fork.t.sol' > fork.log 2>&1; then
              cat fork.log
              exit 0
            fi
            cat fork.log
            if ! grep -Eq "$transport" fork.log; then
              echo "::error title=Fork suite failed::A fork assertion failed against $url. This is not a transport problem."
              exit 1
            fi
            echo "transport failure, trying the next endpoint"
          done
          echo "::notice title=Fork suite skipped::No candidate endpoint served the pinned archive state. Set the MAINNET_RPC_URL secret to run the fork suite here."
          exit 0

      - name: Lint
        run: forge lint --severity high --severity med

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither
        run: pip install slither-analyzer==0.11.6

      - name: Build artifacts
        run: forge build

      - name: Run Slither
        run: slither . --config-file slither.config.json --fail-high
