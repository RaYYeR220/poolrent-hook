name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: default

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv --no-match-path 'test/Fork.t.sol'

      # The fork suite is compatibility evidence against real deployed code, so it must fail loudly
      # on a broken assertion but must not fail on a rate-limited public endpoint. Probe first, and
      # only run it against an endpoint that actually served the pinned archive block.
      - name: Fork compatibility
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          set -uo pipefail
          pinned=25700000
          hex=$(printf '0x%x' "$pinned")
          selected=""
          for url in "${MAINNET_RPC_URL:-}" https://eth.drpc.org https://ethereum-rpc.publicnode.com https://eth.llamarpc.com; do
            [ -z "$url" ] && continue
            body=$(curl -sS --max-time 20 -X POST "$url" -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getBlockByNumber\",\"params\":[\"$hex\",false]}" || true)
            case "$body" in
              *'"result":{'*) selected="$url"; break ;;
            esac
            echo "endpoint did not serve block $pinned: $url"
          done
          if [ -z "$selected" ]; then
            echo "::notice title=Fork suite skipped::No reachable archive endpoint served block $pinned. Set the MAINNET_RPC_URL secret to run the fork suite here."
            exit 0
          fi
          echo "archive endpoint: $selected"
          MAINNET_RPC_URL="$selected" forge test -vv --match-path 'test/Fork.t.sol'

      - name: Lint
        run: forge lint --severity high --severity med

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither
        run: pip install slither-analyzer==0.11.6

      - name: Build artifacts
        run: forge build

      - name: Run Slither
        run: slither . --config-file slither.config.json --fail-high
